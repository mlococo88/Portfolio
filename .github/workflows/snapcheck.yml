name: Snapshot check (temporary)
on:
  push:
    branches: [ccr-9bfd60ed-kp7r0g]
    paths: [tools/snapcheck.py, .github/workflows/snapcheck.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print Alpaca snapshots
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python tools/snapcheck.py
