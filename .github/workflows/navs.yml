name: Ledger fund prices

on:
  schedule:
    # Mutual funds publish their NAV between about 6 and 8 PM Eastern. GitHub
    # often starts scheduled runs late or skips them, so check several times
    # through the evening (odd minutes are less congested than :00).
    - cron: "37 22,23 * * 1-5"   # 6:37 / 7:37 PM EDT (5:37 / 6:37 PM EST)
    - cron: "7,37 0 * * 2-6"     # 8:07 / 8:37 PM EDT (7:07 / 7:37 PM EST)
    - cron: "37 1,2,3 * * 2-6"   # 9:37 / 10:37 / 11:37 PM EDT
  workflow_dispatch:      # lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  navs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update fund prices
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: python navs.py
