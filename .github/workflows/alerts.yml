name: Ledger alerts

on:
  schedule:
    # Every 15 minutes, 08:00–00:59 UTC on weekdays. The script itself
    # ignores runs outside 4 AM – 8 PM Eastern, so DST is handled.
    - cron: "*/15 8-23 * * 1-5"
    - cron: "*/15 0 * * 2-6"
  workflow_dispatch:      # lets you run it by hand from the Actions tab
    inputs:
      test:
        description: "Send a test notification to your phone"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check alerts
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CLOSE_SUMMARY: ${{ vars.CLOSE_SUMMARY || '1' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          TEST: ${{ inputs.test == true && '1' || '0' }}
        run: python alerts.py
