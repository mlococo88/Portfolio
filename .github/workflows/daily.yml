name: Ledger nightly report

on:
  schedule:
    # 8:05 PM Eastern. Both UTC times are listed so it works in EDT and EST;
    # the script only sends during the 7–9 PM ET window, so one of them is a no-op.
    - cron: "5 0 * * 2-6"    # 00:05 UTC = 8:05 PM EDT (previous evening, Mon–Fri)
    - cron: "5 1 * * 2-6"    # 01:05 UTC = 8:05 PM EST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send nightly report
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python daily.py
